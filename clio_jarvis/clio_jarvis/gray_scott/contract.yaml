schema: clio.package-contract.v1
package: gray_scott
version: 0.1.1
kind: application
summary: >-
  ADIOS2 Gray-Scott reaction-diffusion on an L x L x L grid. It writes U and V
  to a growing BP5 output that ParaView's ADIOS2VTXReader can follow while the
  run goes.

parameters:
  required: [nprocs, L, steps, plotgap]
  properties:
    nprocs: {minimum: 1, maximum: 4096}
    ppn: {minimum: 1, maximum: 256}
    L: {minimum: 8, maximum: 2048}
    steps: {minimum: 1}
    plotgap: {minimum: 1}
    dt: {exclusiveMinimum: 0}
    noise: {minimum: 0}
    walltime: {minimum: 1}
  review: [nprocs, L, steps, plotgap, walltime, queue]
  fill:
    run_dir: "{shared_dir}/run"

resources:
  process_count: {param: nprocs}
  processes_per_node: {param: ppn}
  duration: {param: walltime}
  queue_name: {param: queue}

outputs:
  - name: fields
    path: "{run_dir}/gs.bp"
    path_kind: directory
    format: adios2-bp5
    reader: ADIOS2VTXReader
    expected_steps: {div: [steps, plotgap]}
    follow: {signal: reader-time-steps, poll_seconds: 2}
    time: {unit: simulation time, step_interval: {mul: [dt, plotgap]}}
    display:
      array: V
      association: CELLS
      representation: Slice
      slice_normal: [0, 0, 1]
      color_map: Viridis (matplotlib)
      range: [0.0, 0.6]
    arrays: [U, V]

progress:
  unit: step
  # "Simulation at step 300 writing output step     2" is printed before step 2 is written.
  step_pattern: '^Simulation at step\s+(?P<sim_step>\d+)\s+writing output step\s+(?P<step>\d+)\s*$'
  announces: before-write
  output: fields
  total: {div: [steps, plotgap]}
  done_pattern: '^Rank 0 - ET \d+ - milliseconds'

provenance:
  inputs:
    - "{run_dir}/settings.json"
    - "{run_dir}/adios2.xml"
  upstream:
    - name: ADIOS2 examples/simulations/gray-scott, with the clio VTX patch in build/clio_vtx_patch.py
      version: "2.12.1"
      url: https://github.com/ornladios/ADIOS2/tree/master/examples/simulations/gray-scott

selftest:
  params: {nprocs: 4, ppn: 4, L: 64, steps: 400, plotgap: 20, walltime: 600}
  max_seconds: 600
  script: selftest.py
